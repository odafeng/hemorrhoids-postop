<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA Meta — must track the app's default theme (light, see App.jsx),
         otherwise the splash/status bar flashes dark navy before a white app. -->
    <meta name="theme-color" content="#f8fafd" />
    <meta name="color-scheme" content="light dark" />

    <!-- Apple PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="高榮術後追蹤" />
    <!-- PNG, not SVG: iOS Safari cannot decode an SVG apple-touch-icon and
         silently falls back to a screenshot of the page as the home-screen
         icon. Home-screen install is a prerequisite for iOS Web Push here. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- SEO -->
    <title>高雄榮總 術後追蹤系統</title>
    <meta name="description" content="高雄榮民總醫院 大腸直腸外科 — 痔瘡手術術後症狀回報、AI 衛教與智慧追蹤系統" />
  </head>
  <body>
    <script>
      // Apply saved theme before React hydrates to prevent flash
      const t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);

      // Record that this load came from a password-recovery link, BEFORE any
      // module runs. supabase-js consumes and clears the URL hash the moment
      // the client is constructed — which happens at import time, i.e. before
      // useAuth can attach its onAuthStateChange listener — so the
      // PASSWORD_RECOVERY event can be missed entirely. Losing it means the
      // user is silently logged in with their password unchanged, which reads
      // as "the reset link does nothing".
      window.__PASSWORD_RECOVERY__ =
        /[#&]type=recovery(&|$)/.test(window.location.hash);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker Registration.
         The new worker still activates immediately (SKIP_WAITING) so the next
         navigation is fresh, but the page is NEVER auto-reloaded: a deploy
         during clinic hours would otherwise wipe whatever a patient had typed
         into the symptom report. The SW posts SW_UPDATED on activate and
         <UpdateBanner> offers a "重新載入" button instead. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('SW registered:', reg.scope);
              // Force update check on every load so new sw.js rolls out fast
              reg.update().catch(() => {});
              // Claim any waiting worker immediately
              if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              reg.addEventListener('updatefound', () => {
                const nw = reg.installing;
                if (!nw) return;
                nw.addEventListener('statechange', () => {
                  if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                    nw.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(err => console.warn('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>

date: 2026-08-02
weekday: 日
phase: 收案執行
day: 11        # 自 2026-07-23 首例收案起算
objective: 由一則臨床上不合理的警示，追出量測工具與結果指標的三處缺陷並修正

# 註：本檔為公開 repo，僅記錄機制層級內容。
# 個案層級之臨床資料與判讀見 收案文件/個案報告表_CRF紀錄.xlsx（已列入 .gitignore）。

trigger:
  summary: 主持人對系統產生之「持續滲便」警示提出臨床質疑
  reasoning: 該例術式未涉及肛門括約肌，術後不應出現真性糞便滲漏
  note: 此警示通過了所有自動化測試；問題由臨床直覺而非測試發現

findings:
  - id: 1
    title: 警示引擎以「回報次數」冒充「日曆天數」
    category: measurement
    severity: moderate
    detail:
      - 五條 streak 規則皆依紀錄順序計數，從未檢查日期是否相鄰
      - 其中四條的訊息寫「已連續 N 天」，實為「連續 N 次回報」
      - 因追蹤排程為遞減式，POD 7 之後回報本就不相鄰，故此誤述自第二週起成為常態
    resolution: 保留「計算回報次數」之語意（要求日期相鄰會使安全警示於大部分觀察期失效），僅修正措辭並附日期區間
    scope: 前端 alerts.js 與資料庫 trigger fn_check_alerts 兩處獨立實作，均已修正

  - id: 2
    title: 「肛門控制」題項描述涵蓋傷口分泌物
    category: instrument
    severity: major
    detail:
      - 原選項描述為「內褲有少量污漬、不自覺漏出」，涵蓋任何內褲污漬
      - 痔瘡術後內褲污漬最常見來源為傷口分泌物，非控便功能異常
      - 該題存為 continence 欄位並據以觸發控便警示，構念與實測不符
    resolution: 選項改為「偶爾漏便（不自覺漏出糞便、內褲沾到便漬）」，並加註提示引導受試者將分泌物填於傷口欄位
    data_impact:
      structure: 未新增或刪除題項，儲存值不變，資料結構未更動
      split_point: 2026-08-02
      note: 此日之前 continence='滲便' 語意為「內褲有污漬（來源未分）」，之後為「漏出糞便」，分析須分段
    timing_rationale: 於 n=1 時修正，受影響資料僅 2 列且受試者仍可聯繫；屆 20 例將成為永久分裂世代

  - id: 3
    title: 依從率檢視 join 扇出，且分母未依同意書排程
    category: outcome
    severity: major
    detail:
      - v_adherence_summary 同時 LEFT JOIN symptom_reports 與 alerts，每筆回報被警示筆數乘一次
      - 膨脹倍率等於各受試者警示數，故警示愈多者依從率愈高，屬系統性偏差
      - 分母原為 max(pod)+1（假設每日回報），且以最後回報日為基準，使中途失聯者反得高分
    resolution: alerts 改為 EXISTS 子查詢；分母改依協定排程並以術後經過天數為基準
    incidental_finding: 磁碟上 20260326060000_protocol_adherence.sql 早已實作協定式分母但從未套用至 prod（migration 歷史錯位），且同樣帶有扇出缺陷

  - id: 4
    title: 每日提醒推播與同意之追蹤排程不一致
    category: protocol_adherence
    severity: moderate
    detail:
      - check-adherence 對 POD 0–30 每日推播提醒，未區分是否為回報日
      - 受試者於非回報日仍被提醒填寫，與同意書所載頻率不符，且可能影響留存率
    resolution: 改為僅於回報日提醒；排程改由資料庫函式 fn_report_days() 提供，Edge Function 啟動時取一次
    design_note: 今日已因「同一規則存在兩處實作」產生兩個缺陷，故不於 TypeScript 再寫第三份；fn_expected_reports 亦改建於同一函式之上，使提醒排程與依從率分母不可能分歧

decisions:
  - id: 1
    topic: 追蹤排程之權威定義
    decision: 第一週每日、第二週每兩日一次、第三週起每週一次
    encoded_as: POD 0–7（8 次）→ POD 9/11/13（3 次）→ POD 20/27（2 次），30 天共 13 次
    by: 主持人
    note: 同意書載「第 15–30 天每週 1–2 次」，本定義取其保守端，仍在同意範圍內
    single_source: fn_report_days()；依從率分母與每日提醒推播均由此衍生

  - id: 2
    topic: 止痛方案資料之取得方式
    context: 以疼痛回報為主要量測之研究，止痛方案為明顯干擾因子；經確認全 schema 僅有 pain_nrs，未收任何止痛資料
    decision: 不新增 App 欄位，改由院內醫囑系統於分析階段擷取
    rationale:
      - 醫囑紀錄較病人回憶準確
      - 同意書第 2 點逐項列舉問卷內容，新增欄位較措辭釐清更可能需提修正案
      - 不增加受試者每日填答負擔
    limitation: 醫囑取得者為「處方」而非「實際服用量」；本研究幾近全程於出院後，居家 PRN 用藥無從得知，須於 limitation 敘明
    mitigating_factor: 單中心且處方多半常規化，病人間變異有限
    by: 主持人


lesson: >
  函式庫「不管理相依性」這句話要當成需求清單讀，不是免責聲明。openpyxl 的 insert_cols
  會把最顯眼的東西（值與樣式）搬對，把不顯眼的東西（合併範圍、資料驗證、欄寬）留在原地，
  而且兩者都不報錯。這種部分正確比完全不動更危險——檔案打開來看起來是對的。
  凡是插欄插列，事後就要逐格比對位移前後的完整屬性，不能只看值。

lesson_ciphertext_length: >
  pgp_sym_encrypt 的密文長度洩漏明文長度（固定 66 bytes overhead，與金鑰無關），
  這在驗證情境下是可用的資源：不必持有金鑰就能核對欄位是否填了、位數對不對、格式有沒有跑掉。
  本次 phone_enc 的格式差異就是這樣發現的。
  但要同時記住它的上界——長度相同的兩筆互換驗不出來。回報時若不講明這條界線，
  「結構完整」會被讀成「內容正確」，而這兩件事差得很遠。

findings:
  - id: 1
    severity: low
    issue: 前一次以 openpyxl 新增收案列時，只寫入值未套用資料列樣式
    detail: >
      ws['C10'] = value 只設 value，不動 StyleableObject。空白列預設是建檔時整段套下去的
      「待填」樣式（新細明體／非粗體／無字色／靠左），與已填資料列（Noto Sans TC 粗體 #002060 置中）不同，
      因此填值後樣式停在待填態。
    detected_by: PI 目視發現，非程式檢查
    fix: 填值後以 copy(上一列._style) 覆寫；單獨指定 font 會漏掉 alignment / border / fill
    recurrence_signal: 每次新增收案都會重演，除非寫進收案 SOP

  - id: 2
    severity: high
    issue: openpyxl insert_cols() 不搬合併範圍、資料驗證、欄寬——且全部靜默失效
    detail: >
      3.1.5 實測：insert_cols(5) 會搬 cell 物件（含 _style），但 merged_cells.ranges、
      data_validations、column_dimensions 三者原地不動。官方文件明載「不管理相依性」。
    consequence: >
      標題列合併停在 A1:M1 會在新欄邊界斷開；主刀醫師與收案狀態的下拉清單會留在
      F6:F55 / L6:L55，位移後套到錯誤欄位。兩者都不會拋錯。
    fix: 插欄後手動把四個合併範圍 max_col 13→14、兩組 dv.sqref 位移、欄寬由右向左搬移

  - id: 3
    severity: medium
    issue: pii_patients 中 HSF-001 的 phone_enc 為 NULL
    detail: >
      該列建於 2026-07-23（原始收案），不在本次補登的四筆內，因此補電話時被跳過。
      對照表當日已填入該筆聯絡電話。
    fix: 已補，並以相同金鑰加密

  - id: 4
    severity: low
    issue: pii_patients.enrolled_at 記錄的是補登時刻，不是收案時刻
    detail: >
      補登的四筆全為 2026-08-12（寫入當下），但實際收案日分別為 08-04、08-04、08-07、08-12。
      真正的收案時間在 patients.created_at，五筆皆與對照表相符。
    consequence: 下游分析取 patients.created_at 故不受影響，但欄位名稱讀起來會誤導
    fix: 已將四筆對齊 patients.created_at

  - id: 5
    severity: medium
    issue: 本次多次解密 PII，pii_access_log 仍為 0 筆
    detail: 即 2026-08-12 記錄的 ZONE A 未接線問題，稽核觸發器尚未建立
    note: 這次是該缺口第一次在「真的有人讀 PII」的情況下被觀察到，而非僅由 schema 推論

hypotheses_ruled_out:
  - hypothesis: 插欄後可用 unmerge_cells() 再 merge_cells() 重設合併範圍
    disproved_by: >
      insert_cols 已把合併區內的 placeholder cell 物件搬走，unmerge_cells 內部執行
      del self._cells[(1,5)] 時 KeyError: (1, 5)
    note: >
      改為直接修改 CellRange.max_col，完全不碰 _cells。
      失敗發生在 wb.save() 之前，原檔未受影響——這也是先備份再改的價值

  - hypothesis: 密文看不出內容，要驗證 pii_patients 一定得先拿到金鑰
    disproved_by: >
      pgp_sym_encrypt 的 overhead 固定 66 bytes 且與金鑰無關。以任意探測金鑰實測，
      明文 7/8/9/10/12 bytes 對應密文 73/74/75/76/78 bytes。
      據此可在不解密的前提下核對：病歷號位數、姓名字數、日期是否為十碼 YYYY-MM-DD
    note: >
      這一輪先驗掉了「有沒有填、格式對不對」，也正是靠它發現 phone_enc 長度不符預期。
      但長度相同的兩筆互換（如兩筆皆為 8 碼病歷號、3 字姓名）驗不出來，
      要排除錯位仍須解密——這個界線在回報時必須講明，否則會把結構完整誤讀成內容正確

  - hypothesis: 資料庫與對照表的電話格式一致
    disproved_by: >
      phone_enc 為 76 bytes → 明文 10 碼，資料庫存的是純數字；
      對照表存的是含連字號的十二碼
    note: 已採資料庫既有格式（純數字）為準，對照表保留連字號供人閱讀；比對時兩邊正規化


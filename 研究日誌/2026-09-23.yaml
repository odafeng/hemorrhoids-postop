    PI 連續查詢 FIH-005 的聯絡電話與姓名，接著問 HSF-008 的資訊是否填好。
    查核 HSF-008 時順帶掃描全表電話與病歷號位數，產出兩筆誤報。
  event_time: 2026-09-22T17:21:00Z   # 台灣時間 2026-09-23 01:21

findings:
  - id: 1
    severity: none
    issue: HSF-008 三處齊全，無需處理
    detail: >
      對照表第 23 列必填欄位皆有值，狀態「追蹤中」；
      patients 於 09-22 由 App 註冊流程建立；
      pii_patients 四個加密欄位齊全，consent_signed=true、consent_date=2026-09-22，
      enrolled_at 對齊 patients.created_at 而非補登時刻。
      密文長度減 66 後為 電話 10、病歷號 8、姓名 9、生日 10 bytes，全部符合預期。
      回診三欄為空，但手術日即今日（POD 0），本來就還沒有。
    detected_by: CLAUDE.md 記載的 patients ↔ pii_patients left join 對帳查詢
    consequence: 無
    fix: 不需要

  - id: 2
    severity: medium
    issue: 我把電話合格長度寫死成 10 碼，產出兩筆誤報，並差一點動到正確資料
    detail: >
      掃描全表時以「位數 != 10」作為異常判準，報出兩筆：
      HSF-007（9 碼）與 WCC-002（3 字元）。
      HSF-007 實際是市話，台灣市話含區碼就是 9 碼，資料完全正確；
      WCC-002 該欄內容是「未取得」三個字，是刻意標記的缺值，
      pii_patients.phone_enc 為 NULL 與之一致，兩處相符。
      兩筆都不是缺漏。我當時已寫出「HSF-007 的電話要不要補」並說明了同步改動兩處的步驟。
    consequence: >
      若 PI 未當場否決，會對一筆正確的市話號碼發動跨兩個 store 的「更正」，
      並為此備份與改動對照表。誤報的代價不只是雜訊，
      它已經走到提議修改 production 身分資料的前一步。
    fix: >
      驗證規則改為：電話長度只用來區分型別（手機 10 碼、市話 9 碼），
      不作為合格與否的單一判準；非數字內容先讀值再判斷，不要只看長度。

  - id: 3
    severity: low
    issue: 病歷號在對照表中的儲存型別自 FIH-005 起由 int 變為 str
    detail: >
      row 6–19（HSF-001 至 CYH-001）為 int，row 20 起（FIH-005、WCC-004、FIH-004、
      HSF-008）為 str。值本身長度與內容都正確，僅型別不同。
      分界點在 2026-09-17，與該日多筆收案同時發生。
    consequence: >
      目前無影響。但若日後有腳本以型別判斷或做等值比對，混合型別會造成靜默不匹配。
    fix: 未處理，僅記錄

hypotheses_ruled_out:
  - hypothesis: 電話欄位不是 10 碼就是資料有問題
    disproved_by: >
      PI 指出 HSF-007 那支是市話。台灣市話含區碼為 9 碼，
      10 碼只適用於手機。用單一長度當合格條件，等於把所有市話都判成異常。

  - hypothesis: 電話欄位字元數異常短代表漏填
    disproved_by: >
      WCC-002 該欄內容為「未取得」，是三個中文字的明確標記，不是漏填。
      只看長度不讀值，會把「已知取不到」誤判成「還沒填」——
      前者不需要任何動作，後者需要補登，處置完全相反。

  - hypothesis: 密文長度驗證可以獨立判定欄位正確性
    disproved_by: >
      長度驗證能確認「明文位元組數是多少」，不能確認「這個位元組數對不對」。
      對不對取決於欄位語意（手機／市話／標記文字），那個資訊不在長度裡。
      這次三筆長度數字都讀對了，錯的是拿來比對的預期值。


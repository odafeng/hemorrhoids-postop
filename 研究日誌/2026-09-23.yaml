objective: >
  PI 查 HSF-008 的收案資訊是否填齊。三處（對照表、patients、pii_patients）
  對帳結果全部齊全，密文長度驗證也通過，本身沒有問題。
  真正值得記的是查核過程本身：我用「台灣手機 10 碼」當成電話欄位的通用合格條件，
  把一筆市話與一筆刻意標記為「未取得」的欄位都報成異常，
  並且已經開口提議要「補正」其中一筆正確資料。兩個誤報都由 PI 一句話推翻。
  未改動任何檔案，未改動 production schema，未部署。

# 註：本檔位於公開 repo，只記錄機制層級資訊。
# 受試者姓名、病歷號、聯絡方式與加密金鑰一律不寫入，僅以 Study ID 指涉。

trigger:

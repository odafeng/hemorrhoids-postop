lesson_format_check_needs_the_field_semantics: >
  格式檢查要能判斷對錯，必須先知道欄位的語意有幾種合法形狀。
  電話有手機與市話兩種長度，還有「未取得」這種標記值，
  三者在長度上互不相同，但都正確。
  把其中一種形狀寫成唯一的合格條件，另外兩種就會被報成異常。
  這類誤報特別危險，因為它產生的是「有缺漏、要補」的結論，
  而補的動作會去改一筆本來就對的資料。

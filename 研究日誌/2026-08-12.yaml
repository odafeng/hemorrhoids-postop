lesson: >
  對照表是唯一能把 Study ID 還原成真人的文件，更新卻全靠人工，系統這端不會知道自己
  沒被登記。HSF-002 漏登的那五天，該案照常回報症狀、照常產生資料，自動化流程沒有
  一處出錯，斷掉的只有身分那一環。這種缺漏得有人定期去對才會浮現。

lesson_auth: >
  兩個 bug 各自都不致命，疊在一起才把人鎖死：邀請信讓他登入卻沒有密碼，忘記密碼信
  又送不出可用的連結，於是唯一的入口和唯一的補救同時失效。08-05 那次 recovery 在
  production 驗證通過，用的是 PI 自己的 Hotmail；這次收件端是 Gmail。當時的驗證
  是真的，只是只涵蓋了一種收件端。
  另外，把「需要設定密碼」這個狀態放在帳號上而不是 URL 上，之後的重設功能幾乎不用
  多寫程式——清掉 password_set_at 就夠了。狀態該放在活得比一次頁面載入更久的地方。

date: 2026-08-12
weekday: 三
phase: 收案執行
day: 21        # 自 2026-07-23 首例收案起算
objective: >
  核對收案對照表與正式資料庫，補齊漏登之個案；將測試帳號自儀表板統計中排除；
  並在一名新進研究人員被鎖在帳號外之後，將研究人員帳號的發放改為由 PI 當面交付初始密碼

# 註：本檔位於公開 repo，只記錄機制層級資訊。
# 受試者姓名、病歷號、聯絡方式一律不寫入，僅以 Study ID 指涉。

trigger:
  summary: 例行查核：以 study_id 為鍵，比對 收案對照表.xlsx 與 patients / pii_patients / study_invites / surgical_records
  method: >
    四張表 union 出全體 study_id 後逐表 left join，雙向找缺口。只查「對照表有的資料庫有沒有」
    會漏掉反向缺漏，本次問題正好在反向。

findings:
  - id: 1
    severity: high
    issue: HSF-002 收案後未登錄於對照表，且 pii_patients 亦無此筆
    detail: >
      該案 2026-08-07 註冊、08-08 手術、08-09 補錄手術紀錄，至 08-11 已回報 4 天症狀，
      系統端資料完整。但對照表最後存檔為 08-05，收案後未回頭補登。
    consequence: >
      身分對應的兩個存放處同時缺漏，該 Study ID 一度無法還原為特定受試者。
      這次隔五天就發現，PI 仍記得是誰；再拖下去就只能靠當日手術排程回推。

  - id: 2
    severity: medium
    issue: WCC-001 / WCC-002 收案狀態欄停留在「已簽同意書」
    detail: 兩案自 08-05 起每日回報，至 08-11 各累積 7 筆，實際已進入追蹤期

  - id: 3
    severity: medium
    issue: pii_patients 僅有 HSF-001 一筆
    detail: >
      HSF-002、WCC-001、WCC-002 的身分僅存在於對照表 Excel。設計上這兩處互為備份，
      現在這三名受試者的身分只存在一個地方。

  - id: 4
    severity: low
    issue: HSF-001 同意狀態在兩張表之間不一致
    detail: patients 為 consent_signed=true / consent_date=2026-07-23，pii_patients 為 false / null
    note: 與 2026-07 已決議「紙本同意書為準」之簽名欄議題無關，此處純為兩表未同步

  - id: 5
    severity: high
    issue: 研究人員儀表板把 TEST-001 計入收案數與依從率
    detail: >
      v_adherence_summary 只排除 study_status='withdrawn'，TEST-001 為 active 故納入。
      該帳號不回報症狀，total_reports 恆為 0，而 expected_reports 依手術日 2026-07-18
      逐日累加，當日已達 12。
    impact: >
      四名真實受試者依從率皆為 100%，儀表板卻顯示 80.0%，收案數顯示 5 而非 4。
      誤差每日擴大，直到 30 天上限為止。
    note: 由對照表核對順帶發現——查 TEST-001 為何不在對照表時才注意到它進了統計分母

  - id: 6
    severity: high
    issue: 邀請信點開後直接進入儀表板，受邀者從未設定密碼
    detail: >
      inviteUserByEmail 建立的帳號帶有一組 GoTrue 自行產生、不對任何人顯示的隨機密碼
      （以 pgcrypto 驗證 encrypted_password 並非空字串亦非空密碼雜湊）。App 端只辨識
      URL hash 中的 type=recovery；supabase-js 對 invite 只發 SIGNED_IN 而非
      PASSWORD_RECOVERY，故整套設定密碼的接線不會觸發。
    impact: >
      auth log 顯示當事人 12:38 點信登入，隨後在 13 分鐘內：重複點擊已失效的邀請連結五次
      （one-time token 第二次即失效）、嘗試重新註冊一次（422 已存在）、以密碼登入兩次
      （400 憑證錯誤）。他持有一組不可能知道的密碼。

  - id: 7
    severity: high
    issue: 忘記密碼信在 Gmail 中不含可點擊的重設連結
    detail: >
      Reset Password template 為 Supabase 預設，確含 {{ .ConfirmationURL }}；
      recovery_token 亦正常產生（56 字元）。但收件端截圖顯示末行 "Reset Password"
      以純文字呈現，無連結樣式。兩次 /recover 之後，auth log 中沒有任何一次成功的
      type=recovery verify。
    contrast: >
      2026-08-05 同一 template、同一 Resend SMTP 曾在 production 完成整段 recovery
      流程（見該日日誌）。差異在收件端：當時為 Hotmail，本次為 Gmail。
    status: 未確認根因。已請 PI 於 template 中加印純文字網址，該變更同時是修復也是判別工具
    scope_note: >
      研究人員流程已改為不寄信，故不再受此影響；但**病人端的「忘記密碼」仍走同一條路徑**，
      且現有受試者信箱多為 Gmail。研究人員可透過 admin-reset-password 代為重設，
      自助重設在 template 修正前仍不可靠。

# 走錯的路。日誌若只記通往答案的那條線，這些會全部流失，
# 下一個遇到同樣症狀的人得重走一次。
hypotheses_ruled_out:
  - hypothesis: 重設信沒有連結，是因為 Reset Password template 少了 {{ .ConfirmationURL }}
    disproved_by: PI 貼出 Dashboard 的 template，確為 Supabase 預設版本且含該變數
    note: 這是第一個假設，也是最直覺的一個。若未查證，會一路往 template 語法與跳脫規則鑽

  - hypothesis: 連結其實是好的，只是當事人沒有點
    disproved_by: >
      auth log 顯示兩次 /recover 之後，沒有任何一次成功的 type=recovery verify。
      期間五次 /verify 全為 "One-time token not found"，時序上對應的是重複點擊
      已用過的「邀請」連結，不是重設連結
    note: 排除這一項，才確定問題在信件本身而非使用者行為

  - hypothesis: 受邀帳號的 encrypted_password 是空字串，所以沒有密碼可用
    disproved_by: >
      crypt('', encrypted_password) = encrypted_password 為 false，且長度 60、前綴 $2a$，
      是一組真實存在但無人知曉的隨機密碼
    note: >
      這個差別直接影響嚴重度判斷。若只是空密碼，或許還有其他登入途徑；
      確認是隨機密碼之後才確定當事人「永遠」登不進去，也才確定必須強制設定密碼

  - hypothesis: 把 index.html 的偵測條件從 type=recovery 放寬到 recovery|invite 就夠了
    disproved_by: >
      supabase-js 在 client 建構時（import 期間）即消費並清除 URL hash。
      受邀者只要在設定密碼前重整或關閉分頁，判斷依據就消失，帳號永久鎖死——
      正是這次要修的失效模式本身
    note: 因此改為讀帳號上的 user_metadata.invited_at / password_set_at

  - hypothesis: 本機建置與線上的 bundle hash 不同，代表新版沒上線
    disproved_by: >
      工作目錄乾淨且 HEAD 與部署 commit 相同，hash 仍相異。
      bundle 會 inline VITE_* 環境變數，本機與 Vercel 的值不同，內容不同則 hash 必然不同
    note: 比 hash 每次都會得到假陰性。改以字串比對

  - hypothesis: 線上仍回舊 bundle，代表這次部署失敗
    disproved_by: >
      get_deployment 顯示 readyState=READY、aliasError=null、alias 含正式網址。
      實為 edge 節點快取（x-vercel-cache: HIT，age 單調遞增，query string cache buster 無效），
      至下一次部署才失效
    note: 讀到舊 bundle 應先查部署狀態，不要直接判定失敗而重推一次


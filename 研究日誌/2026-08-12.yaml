date: 2026-08-12
weekday: 三
phase: 收案執行
day: 21        # 自 2026-07-23 首例收案起算
objective: 核對收案對照表與正式資料庫，補齊漏登之個案；並將測試帳號自儀表板統計中排除

# 註：本檔位於公開 repo，只記錄機制層級資訊。
# 受試者姓名、病歷號、聯絡方式一律不寫入，僅以 Study ID 指涉。

trigger:
  summary: 例行查核：以 study_id 為鍵，比對 收案對照表.xlsx 與 patients / pii_patients / study_invites / surgical_records
  method: >
    四張表 union 出全體 study_id 後逐表 left join，雙向找缺口。只查「對照表有的資料庫有沒有」
    會漏掉反向缺漏，本次問題正好在反向。

findings:
  - id: 1
    severity: high
    issue: HSF-002 收案後未登錄於對照表，且 pii_patients 亦無此筆
    detail: >
      該案 2026-08-07 註冊、08-08 手術、08-09 補錄手術紀錄，至 08-11 已回報 4 天症狀，
      系統端資料完整。但對照表最後存檔為 08-05，收案後未回頭補登。
    consequence: >
      身分對應的兩個存放處同時缺漏，該 Study ID 一度無法還原為特定受試者。
      這次隔五天就發現，PI 仍記得是誰；再拖下去就只能靠當日手術排程回推。

  - id: 2
    severity: medium
    issue: WCC-001 / WCC-002 收案狀態欄停留在「已簽同意書」
    detail: 兩案自 08-05 起每日回報，至 08-11 各累積 7 筆，實際已進入追蹤期

  - id: 3
    severity: medium
    issue: pii_patients 僅有 HSF-001 一筆
    detail: >
      HSF-002、WCC-001、WCC-002 的身分僅存在於對照表 Excel。設計上這兩處互為備份，
      現在這三名受試者的身分只存在一個地方。

  - id: 4
    severity: low
    issue: HSF-001 同意狀態在兩張表之間不一致
    detail: patients 為 consent_signed=true / consent_date=2026-07-23，pii_patients 為 false / null
    note: 與 2026-07 已決議「紙本同意書為準」之簽名欄議題無關，此處純為兩表未同步

  - id: 5
    severity: high
    issue: 研究人員儀表板把 TEST-001 計入收案數與依從率
    detail: >
      v_adherence_summary 只排除 study_status='withdrawn'，TEST-001 為 active 故納入。
      該帳號不回報症狀，total_reports 恆為 0，而 expected_reports 依手術日 2026-07-18
      逐日累加，當日已達 12。
    impact: >
      四名真實受試者依從率皆為 100%，儀表板卻顯示 80.0%，收案數顯示 5 而非 4。
      誤差每日擴大，直到 30 天上限為止。
    note: 由對照表核對順帶發現——查 TEST-001 為何不在對照表時才注意到它進了統計分母

actions:
  performed:
    - 對照表補入 HSF-002 第 4 列：Study ID、手術日期 2026-08-08、主刀 HSF、收案日期 2026-08-07、狀態追蹤中
    - 姓名與病歷號由 PI 當場提供後填入
    - WCC-001 / WCC-002 收案狀態改為「追蹤中」
    - 修改前先將原檔備份至工作區外（對照表為 gitignored 個資文件，備份不進版本控制）
    - 儀表板統計與圖表排除 TEST-001（commit df48665）：
      收案列表仍照常顯示該帳號，e2e/researcher-flow.spec.ts 會斷言該列可見
  not_performed:
    - id: pii_patients 補登三筆
      reason: 加密通行碼由 PI 單獨保管，不經過工作階段；已備妥 SQL 交由 PI 於 Supabase SQL editor 自行執行
    - id: HSF-001 第二次回診（D14）日期
      reason: 該案手術 07-24、D14 應為 08-07 且已逾期，但實際回診日期不在系統內，需由 PI 依門診紀錄填寫

changes:
  code:
    - ResearcherDashboard 新增 NON_SUBJECT_STUDY_IDS 與 isStudySubject()，
      統計（ENROLLED / ADHERENCE / of N total）與 ResearcherCharts 改吃過濾後的陣列
    - 過濾點刻意放在統計層而非 getAllPatients()，避免同時把收案列表的該列藏掉
  tests:
    - ResearcherDashboard.test.jsx 新增 3 項：收案數排除、依從率分母排除、列表仍可見
  unchanged:
    - v_adherence_summary 未變更。收案期間不動 production schema，
      且該 view 是 e2e 與離線分析共用的資料來源
    - CSV 匯出未受影響：TEST-001 無 symptom_reports，本來就不會出現在匯出結果中

deployment:
  status: 已部署
  pushed: af275f1..37e69cb（三個 commit）
  delay_cause: >
    GitHub token 失效致 push 一度受阻，PI 重新認證後推送。期間 production 維持舊版，
    儀表板仍顯示受污染的數字約 15 分鐘。
  targets:
    - target: Vercel production
      note: git integration 觸發，不等 CI
      verified: live bundle index-43sKT_Ud.js 內含字串 'TEST-001'，確認排除清單已上線
    - target: Supabase Edge Functions
      note: CI 之 Deploy Supabase job success；本次無函式原始碼變更
  patient_impact: >
    bundle 變更會使開著 App 的患者看到「系統已更新」橫幅。執行時間為 01:00 前後，
    四名受試者當日回報均已完成，影響最小。
  verification_method: >
    以 bundle 內的字串常數驗證，不比對 hash——本機與 Vercel 的建置環境不同，
    hash 本就會相異，比 hash 會得到假陰性。

verification:
  - 全套 Vitest 33 files / 406 tests passed；npm run lint 無輸出；npm run build 成功
  - CI run 31515380806 全綠：Deno、test、e2e、Deploy Supabase 四個 job 皆 success。
    e2e 為本次關鍵關卡——researcher-flow 會斷言 TEST-001 列可見，若過濾點放錯層級此關必紅
  - RED 階段實際觀察到兩項新測試失敗，且數值與 production 一致（收案數 5、依從率 80.0%），
    確認測試確實咬住該缺陷而非恆真
  - 補登後重跑同一組 join：patients 五筆中除 TEST-001 外，四筆與對照表逐欄一致
  - 手術日期、收案日期、主刀醫師三欄與資料庫完全相符；邀請碼使用時間亦與收案日期吻合
  - 檔案結構未受損：兩組 data validation（主刀醫師 F6:F55、收案狀態 L6:L55）與四組合併儲存格皆保留
  - TEST-001 不在對照表為預期結果，該帳號須於資料分析前刪除

follow_ups:
  - pii_patients 補登 HSF-002 / WCC-001 / WCC-002，並順手修正 HSF-001 的 consent 欄位
  - HSF-001 補填 D14 實際回診日期
  - check-adherence 亦以 study_status='active' 取得對象，TEST-001 在內，故會照排程對其
    發出回報提醒。本次刻意未改：測試帳號收得到提醒，才驗證得了提醒功能本身。
    此處與儀表板性質不同——儀表板是把測試資料混入研究統計，提醒則是測試該有的行為。
    CSV 匯出同理保留，匯出為原始資料，在該層過濾會使匯出結果與資料庫對不起來。
  - 評估在每日摘要排程加入一致性檢核：patients 有紀錄但 pii_patients 無對應者即告警。
    此檢核讀不到 Excel，只能守住加密資料表這一側，但足以在收案當天而非五天後發現漏登。

lesson: >
  對照表是唯一能把 Study ID 還原成真人的文件，更新卻全靠人工，系統這端不會知道自己
  沒被登記。HSF-002 漏登的那五天，該案照常回報症狀、照常產生資料，自動化流程沒有
  一處出錯，斷掉的只有身分那一環。這種缺漏得有人定期去對才會浮現。

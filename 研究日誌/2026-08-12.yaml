changes:
  code:
    - ResearcherDashboard 新增 NON_SUBJECT_STUDY_IDS 與 isStudySubject()，
      統計（ENROLLED / ADHERENCE / of N total）與 ResearcherCharts 改吃過濾後的陣列
    - 過濾點刻意放在統計層而非 getAllPatients()，避免同時把收案列表的該列藏掉
    - useAuth 的 passwordRecovery 改為 passwordSetup（'recovery' | 'invite' | null）。
      invite 的判斷讀 user_metadata.invited_at 而非 URL hash：supabase-js 在第一次載入
      就會清掉 hash，讀 URL 等於讓「設定密碼前先重整」的人永久鎖死，而那正是要修的失效模式
    - updatePassword 於同一次 updateUser 呼叫寫入 password_set_at，作為 invited_at 的解除條件
    - SetNewPassword 在 invite 情境隱藏「稍後再設定」：recovery 可以拖，因為舊密碼還能用；
      invite 拖了就是登入一個沒有任何密碼打得開的帳號
    - researcher-invite 改用 createUser + email_confirm，接受 PI 指定的 initial_password
    - errors.ts 移除 SMTP 與寄信頻率兩個分支（改為不寄信後永遠走不到），新增 weak_password
    - 重設密碼按鈕不再限定 !last_sign_in_at：會需要它的帳號正好都登入過一次
  tests:
    - ResearcherDashboard.test.jsx 新增 3 項：收案數排除、依從率分母排除、列表仍可見
    - onboarding.test.js 新增 5 項涵蓋受邀者設定密碼，含「重整後仍要求設定」的回歸測試
    - SetNewPassword.test.jsx 新增 3 項：invite 無退出路徑、recovery 保留、歡迎文案
    - actions.test.ts 重寫為 6 項，含「清掉 password_set_at」與「補蓋 invited_at」
    - RED 階段實際觀察到 10 項失敗，確認測試咬得住缺陷
  unchanged:

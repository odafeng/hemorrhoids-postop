lesson: >
  錯誤回報管線本身要當成 production 程式碼驗證，而不是「反正只是 log」。
  這次 Sentry 與 client_error_logs 兩條路都在，但共用同一個把訊息銷毀的轉換函式，
  於是雙寫的冗餘完全失效——冗餘只有在故障模式彼此獨立時才算冗餘。
  另外，getAlerts 前一行的 console.error('[getAlerts]', error.message) 一直拿得到正確訊息；
  真正的資訊就在手上，是下一行自己丟掉的。

lesson_two_stores_no_reconciliation: >
  同一份事實分存兩個地方、其中一邊由程式自動建立、另一邊靠人工，
  漏的一定是人工那邊，而且不會有任何東西提醒你。
  patients 由註冊流程建立所以永遠不會漏；pii_patients 靠人補所以漏了三筆，
  中間沒有外鍵、沒有對帳、沒有告警，只有「有人剛好去看」。
  對策不是更小心，是寫一個能跑的對帳查詢並放進 CLAUDE.md——
  能被執行的檢查才算檢查，寫在流程文件裡的提醒不算。

lesson_verify_before_destroying_source: >
  刪掉來源檔之前，要驗證的是「內容等值」而不是「格式正確」。
  密文長度、欄位型別、筆數全部對，仍然可能是把某兩筆的電話對調了。
  這次的做法是雜湊比對：資料庫端解密後算 md5、來源檔在本機算 md5，兩邊都不輸出明文，
  相等才刪。成本是一次查詢，換掉的是「刪完才發現轉錄錯了而來源已不存在」。

lesson_query_false_negative: >
  對日誌／可觀測性系統下查詢時，「查無資料」與「查錯欄位」在輸出上無法區分。
  下任何過濾條件之前，先無條件撈一筆原始記錄確認欄位名稱，成本一次查詢，
  省下的是把假陰性當成證據之後的整條錯誤推論。

  - 臨床影響查核：WCC-001 僅一筆 2026-08-07 ascending_pain 警示且已 acknowledged，本次未漏警示

follow_ups:
  - item: 底層 fetch 失敗的真正原因仍未知
    detail: >
      行動網路瞬斷、或病人切換 App／關閉 PWA 導致 in-flight 請求被 abort，
      兩者訊號完全相同。正因訊息被銷毀而無法分辨。
    next: 下次同類事件的 Sentry 標題會直接帶出 message 與 code，屆時即可判定
    owner: 待下次事件

  - item: 部署後以測試帳號實地確認前端已上線
    detail: 依 CLAUDE.md，比對線上 bundle 字串而非 hash

lesson: >
  錯誤回報管線本身要當成 production 程式碼驗證，而不是「反正只是 log」。
  這次 Sentry 與 client_error_logs 兩條路都在，但共用同一個把訊息銷毀的轉換函式，
  於是雙寫的冗餘完全失效——冗餘只有在故障模式彼此獨立時才算冗餘。
  另外，getAlerts 前一行的 console.error('[getAlerts]', error.message) 一直拿得到正確訊息；
  真正的資訊就在手上，是下一行自己丟掉的。

lesson_query_false_negative: >
  對日誌／可觀測性系統下查詢時，「查無資料」與「查錯欄位」在輸出上無法區分。
  下任何過濾條件之前，先無條件撈一筆原始記錄確認欄位名稱，成本一次查詢，
  省下的是把假陰性當成證據之後的整條錯誤推論。

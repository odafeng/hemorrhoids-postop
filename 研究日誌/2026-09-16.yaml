lesson_audit_has_two_shapes: >
  盤點缺漏時，「空的」與「舊的」是兩種形狀，而只有第一種會出現在 is null 查詢裡。
  這次第一份報告列完所有空白格，讀起來像盤點完成，實際上另有六格填了值但與權威來源不符。
  過期的值比空白格更難發現，因為空白格至少看得出來沒填。
  對策是稽核一律做兩趟：一趟查 NULL，一趟拿兩份來源逐欄比對。

lesson_threshold_from_approved_documents: >
  要為某個分類定門檻時，先去已核准文件裡找有沒有現成的界線，不要從資料分佈挑。
  這次 POD 14 來自受試者同意書的階段劃分，不是來自「資料在這裡有個空隙」。
  兩者在本次資料上給出相同的分類結果，但前者可以回答「為什麼是 14 不是 10」，後者不行。
  附帶收穫是發現那個空隙有一部分是排程造成的假象——POD 14 至 19 本來就沒有應回報日。

lesson_dropout_may_not_be_silence: >
  把「沒回報」讀成「沒事」，等於預設缺失隨機。這次配對比較顯示方向可能相反：
  停止回報者在停之前更痛、而且每一筆都還在出血。n 太小不能下結論，
  但足以說明「沒消息就是好消息」在這個系統裡不是安全的預設——
  而這正是一個症狀監測 App 最不該弄錯的假設。

lesson_run_the_documented_reader_on_every_row: >
  一列資料可以內容全對、長度全對、對帳查得到，卻用文件化的讀法讀不出來。
  存在性、長度、md5 都驗不出「寫入路徑不同」，唯一驗得出的是對每一列實際跑那個讀法。
  這一列的來歷也查不到——沒有日誌記它的寫入，只有稽核表的時間戳。
  下次看到「這一列的樣式／來歷與其他列不同」，先用文件化的讀法讀它一次。

lesson_print_by_header_not_by_index: >
  讀對照表做檢查時，我用欄位索引印「手術日期」與「收案日期」，實際印出的是出生日期與聯絡電話整欄——
  差一欄。沒有寫入任何檔案，但個資進了終端輸出。
  印對照表任何一列之前，用標題列對應欄位名稱，只印白名單內的欄，不要用索引。

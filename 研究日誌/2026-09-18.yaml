lesson_audit_has_a_third_shape: >
  2026-09-16 記了缺漏的兩種形狀：空的、舊的。今天出現第三種——填了但不是值。
  「未取得」這個字串非空、且 DB 端同樣沒有資料，所以查 NULL 與兩來源比對這兩趟都判它一致。
  唯一抓得到的方式是對欄位內容做格式斷言，問「這是不是一個電話號碼」而不是「這裡有沒有東西」。
  代價是具體的：誤報讓 PI 差點去找一個從來不存在的號碼。
  存在性檢查回答的問題比它看起來的窄，不要拿它當完整性檢查用。

lesson_timezone_before_date_comparison: >
  timestamptz 直接 ::date 走 UTC。台北時間午夜整點（如退出日 2026-09-01 00:00+08）
  會顯示成前一天，看起來像差一天的實質錯誤。本專案所有時間欄位都是 timestamptz，
  凡是要拿日期跟日誌或紙本比對的查詢，先 at time zone 'Asia/Taipei'。

lesson_recurrence_interval_is_the_signal: >
  同一個 failure mode 第三次發生，但真正的訊號不是次數而是間隔：33 天、2 天。
  收案速率上升時，依賴「記得手動登錄」的步驟漏失頻率跟著上升，而偵測方式仍然是人想到要去查。
  補登本身每次都只花幾分鐘，所以每次都很容易當成小事處理掉，不去動那個會持續產生它的機制。

lesson_deidentification_scan_must_be_format_based: >
  commit 前的 PII 掃描若照「今天處理了誰」列舉姓名與號碼，就只擋得住當天的主角。
  今天差點外流的是一筆既有受試者的市話，它出現在日誌裡的理由是要說明一個正則誤報
  ——引用具體值來佐證「這個值為什麼合法」，是稽核報告最自然的寫法，
  而它與去識別化直接衝突，且必然引用到清單外的人。
  掃描要問「這段文字裡有沒有長得像識別資料的東西」，不是「有沒有這幾個人的識別資料」。
  對照組是有用的：同一次掃描擋不住的東西，格式斷言一次就抓到——
  這和 finding 2 的教訓是同一件事的兩面，存在性清單答不了完整性問題。

date: 2026-09-18
weekday: 五
phase: 收案執行
day: 58        # 自 2026-07-23 首例收案起算
objective: >
  PI 問「現在缺哪些病人資訊」。對帳查出 FIH-004、FIH-005、WCC-004 三筆在 patients 已存在、
  對照表與 pii_patients 都沒有——2026-08-14、2026-09-16 之後同一個 failure mode 第三次發生。
  當日補齊三處。過程中另外兩件比補登本身更值得記：一是我的稽核把一個佔位字串讀成了資料，
  二是一個看似的日期不一致其實是 UTC 轉換造成的假警報。
  未改動 production schema，未部署。

# 註：本檔位於公開 repo，只記錄機制層級資訊。
# 受試者姓名、病歷號、聯絡方式與加密金鑰一律不寫入，僅以 Study ID 指涉。

trigger:
  summary: PI 要求盤點缺漏，隨後提供三筆新收案的個資，並裁示處理 WCC-002 的電話欄
  event_time: 2026-09-18T06:57:00Z   # 台灣時間 14:57

findings:
  - id: 1
    severity: high
    issue: 三筆收案在 patients 已存在，對照表與 pii_patients 都沒有（同一 failure mode 第三次）
    detail: >
      FIH-004、FIH-005、WCC-004 皆於 2026-09-17 晚間 19:37–19:54 之間自 App 註冊。
      三人都已在使用 App：FIH-004 有 2 筆回報、WCC-004 有 1 筆、FIH-005 手術日為 09-18 尚無回報。
      WCC-004 的 surgical_records 已由主刀醫師填入，FIH-004、FIH-005 尚缺。
      前兩次分別為 2026-08-14（HSF-003/004/005）與 2026-09-16（HSF-007/CYH-001）。
    detected_by: CLAUDE.md 記載的 patients ↔ pii_patients left join 對帳查詢
    consequence: >
      與前兩次相同：App 與 dashboard 只讀 patients，缺漏期間系統行為完全正常，
      不一致在 schema 層面合法，不會有任何錯誤訊息。
      值得注意的是間隔正在縮短——第一次到第二次 33 天，第二次到第三次 2 天，
      而收案速率在上升（09-17 一晚三例）。人工登錄這一步的漏失率不會自己好轉。
    fix: 當日補齊 pii_patients 三列與對照表第 20–22 列，對帳查詢回傳空集合，三處對齊在 17 筆

  - id: 2
    severity: medium
    issue: 稽核把佔位字串讀成資料，誤報一項不存在的不一致
    detail: >
      第一份報告指出「WCC-002 對照表有聯絡電話、pii_patients.phone_enc 為 NULL，兩邊不一致」。
      實際上該格內容是字串「未取得」，不是號碼。phone_enc = NULL 才是正確表示法，沒有東西可補。
      誤判來自稽核腳本以「非空白」判定已填。
    consequence: >
      這是缺漏的第三種形狀。2026-09-16 記錄了兩種——空的、舊的；今天這種是「填了但不是值」，
      它同時通過 is null 查詢與目視的非空檢查，比前兩種都更難發現。
      代價是一次誤報：若 PI 照該報告去「補」，會去找一個從來沒取得過的號碼。
    fix: >
      稽核改用格式斷言而非存在性檢查。電話欄斷言 ^0\d{1,3}-\d{3,4}-\d{3,4}$、
      病歷號 ^\d{7,8}$、出生日期須為 datetime 型別。重跑後對照表 17 列僅 WCC-002 一格不合格。

  - id: 3
    severity: low
    issue: withdrawn_at 與日誌記載差一天，是 UTC 轉換造成的假警報
    detail: >
      查核時 pii_patients.withdrawn_at::date 顯示 HSF-006 為 2026-08-31，
      而 2026-09-02.yaml 記載退出日為 09-01。改以 at time zone 'Asia/Taipei' 取值後為
      2026-09-01 00:00:00，資料正確。timestamptz 的 ::date 走 UTC，台北時間午夜整點會退一天。
    consequence: >
      差一天的日期不一致在臨床研究裡看起來像實質錯誤（退出日影響資料保留範圍），
      容易觸發一輪不必要的追查。本專案所有時間欄位都是 timestamptz，這個陷阱會重複出現。
    fix: 對 timestamptz 做日期比對一律先 at time zone 'Asia/Taipei'，不直接 ::date

  - id: 4
    severity: info
    issue: 2026-09-16 的 follow-up D4 已可關閉
    detail: >
      WCC-003 與 CYH-001 的 surgical_records 已分別於 09-16、09-17 補入，
      術式、痔瘡分級、縫合材料、能量器械、麻醉方式皆有值，非空殼列。
      原決策是延後至分析階段自院內手術紀錄補登，實際上主刀醫師自行填了。
    consequence: CRF 表單一的預填來源已齊，該 follow-up 不需帶到分析階段

  - id: 5
    severity: high
    issue: 稽核報告的引文把一筆受試者聯絡電話寫進了日誌草稿（未 commit，已移除）
    detail: >
      格式斷言重跑後有兩格不合格，其中 HSF-007 是市話、格式合法。
      為了說明「為什麼正則誤判」，草稿在 findings 與 lessons_learned 裡直接引用了該號碼。
      commit 前的 PII 掃描只比對了當日新增三筆的姓名、病歷號與電話，
      沒有涵蓋既有受試者的識別資料，所以掃描通過。移除後才 commit，未進入版本歷史。
    consequence: >
      這個 repo 是公開的。若 commit 並 push，撤回需要改寫歷史，而 GitHub 的快取與
      既有 clone 不保證跟著消失。實質風險等同外流。
    root_cause: >
      引用具體值來佐證「這個值為什麼合法」是稽核報告的自然寫法，而它與去識別化原則直接衝突。
      掃描清單是照「今天處理了誰」建的，不是照「檔案裡可能出現誰」建的——
      而誤報的引文必然來自既有個案，正好落在清單外。
    fix: >
      改以特徵描述取代值本身（「07 區碼、單破折號格式，與其餘各列的 4-3-3 手機格式不同」）。
      掃描改為格式導向：對日誌檔斷言不得出現 \d{7,} 連續數字串與 0\d{1,3}-\d{3,4}-\d{3,4}，
      不再依賴逐一列舉當事人。


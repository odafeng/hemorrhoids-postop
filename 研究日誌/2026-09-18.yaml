      原判斷來自稽核腳本的「非空白即已填」規則。

  - hypothesis: HSF-006 的 withdrawn_at 記錯了一天
    disproved_by: >
      at time zone 'Asia/Taipei' 取值為 2026-09-01 00:00:00，與 2026-09-02.yaml 一致。
      ::date 對 timestamptz 走 UTC，台北午夜整點會退一天。

  - hypothesis: 列出空白格加上與 DB 逐欄比對，就涵蓋了所有缺漏形狀
    disproved_by: >
      2026-09-16 定的兩趟稽核（查 NULL、比對來源）都通不過「未取得」這種佔位字串——
      它非空、且 DB 端同樣沒有值，兩趟都判它一致。要抓只能對欄位內容做格式斷言。


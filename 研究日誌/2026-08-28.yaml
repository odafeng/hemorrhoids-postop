date: 2026-08-28
weekday: 五
phase: 收案執行
day: 37        # 自 2026-07-23 首例收案起算
objective: >
  起點是 PI 的一句盤點：「對照表還有哪些人的 PII 還沒對齊？」問題本身預設缺口在
  對照表裡面，查完發現方向相反——對照表上的八列全部對齊，缺的是兩位連對照表都
  還沒登錄的新收案。補登過程另外撞出 Excel 樣式的一個 parity 陷阱，
  以及 CLAUDE.md 現行寫法涵蓋不到的一段。

# 註：本檔位於公開 repo，只記錄機制層級資訊。
# 受試者姓名、病歷號、聯絡方式與加密金鑰一律不寫入，僅以 Study ID 指涉。

trigger:
  summary: >
    PI 詢問收案對照表中哪些受試者的 PII 尚未與 pii_patients 對齊。
  event_time: 2026-08-27T17:15:00Z   # 台灣時間 2026-08-28 01:15

findings:
  - id: 1
    severity: medium
    issue: 缺口不在對照表內部，而是兩位個案完全沒進入任何一份人工紀錄
    detail: >
      收案對照表第 6–13 列共八筆（HSF-001~005、WCC-001/002、FIH-001），
      逐筆在 pii_patients 都有對應列，四個加密欄位的密文長度反推明文位元組數
      與對照表欄位內容一致。缺的是 FIH-002 與 FIH-003：App 註冊流程已自行建立
      patients 列（created_at 分別為 2026-08-26T11:28Z、2026-08-27T14:08Z），
      但對照表停在序號 8，pii_patients 也只有八筆。
      pii_patients 無孤兒列（沒有 patients 對不到的 study_id）。
    consequence: >
      FIH-002 延遲 2 天、FIH-003 延遲 1 天。兩者皆已進入追蹤期，
      若期間需要聯絡受試者，兩份能還原身分的紀錄都查不到人。
      這正是 CLAUDE.md「兩者不會互相提醒，也不會有人報錯」描述的模式，
      只是這次連對照表那一端也沒有被打開過——2026-08-12 的
      lesson_zone_a 說「真正在運作的是那份 Excel 對照表，因為每收一位就得打開它一次」，
      這個前提在收案者不是 PI 本人時不成立。三位缺口個案全部是 FIH 收的。

  - id: 2
    severity: low
    issue: 空白列 14–55 是隔列上色，樣式複製必須涵蓋整列 A–N
    detail: >
      待填區奇數列（15、17…55）填色 FFF2F7FB，偶數列（14、16…54）無填色，
      兩者在全部 14 欄的 style id 都不同。已填資料列 10–13 樣式完全一致且無填色，
      表示一列從「待填」轉為「資料」時是整列換掉 banding。
      因此新增列必須對 A–N 全欄複製前一資料列的 _style，
      只複製有值的欄位會讓 J/K/L/N 等空欄殘留 banding。
    consequence: >
      CLAUDE.md 現行寫法「設完 .value 要再 copy() 前一列的 _style」方向正確，
      但沒有提到 parity，也容易被讀成「只需處理有寫值的欄位」。
      本次第 15 列若只複製有值欄位，會在 J/K/L/N 留下藍底。

  - id: 3
    severity: low
    issue: pii_patients.mrn_enc 是 NOT NULL，phone_enc 才可為空
    detail: >
      pii_patients 僅 phone_enc 與 national_id_enc 允許 NULL。
      WCC-002 的 phone_enc 為 NULL 與對照表 H 欄「未取得」一致，不是漏填。
      病歷號缺漏則會在 INSERT 當下被 schema 擋下，不會靜默寫入半筆。
    consequence: >
      補登流程若缺病歷號，是硬阻斷而非需要事後對帳的軟缺口。這一欄不必列入核對清單。

  - id: 4
    severity: info
    issue: 本機無 openpyxl，系統 Python 為 PEP 668 externally-managed
    detail: >
      python3.14（homebrew）與 python3.11 皆無 openpyxl，
      `pip install` 被 externally-managed-environment 擋下。
      改在 scratchpad 建 venv 安裝 openpyxl 3.1.5，不污染使用者環境。
    consequence: >
      對照表的讀取可用 stdlib zipfile + ElementTree 完成（本次盤點階段即如此），
      但寫入要保留樣式與資料驗證，實務上仍需 openpyxl。
      下次維護對照表前先確認這個 venv 是否還在（scratchpad 會隨 session 清掉）。

  - id: 5
    severity: medium
    issue: 受試者識別資料進入了 Claude Code 的 transcript 與 claude-mem observation DB
    detail: >
      本次補登所需的姓名、出生日期、聯絡電話、病歷號由 PI 直接貼入對話，
      而非放在本機暫存檔後讀取即刪（2026-08-14 用的做法）。
      落點為 ~/.claude/projects/ 下的 transcript，以及 claude-mem 的 observation 資料庫。
      兩者皆在本機、不在 repo，未觸及公開 repo 的硬性限制。
    consequence: >
      多出一份非預期的留存副本，且 claude-mem 的內容會被後續 session 讀回。
      待決：是否清理本次 transcript 與對應 observation。

  - id: 6
    severity: info
    issue: patients.app_activated 的處置尚未收斂
    detail: >
      PI 提出「要嘛拿掉，要嘛預設都 True」。現況為 NOT NULL DEFAULT FALSE，
      codebase 無任何寫入處，十筆全為 false。
      讀取端只有 prototype/scripts/dashboard.py:174 與 :374（本機維運腳本，非 production）。
      2026-08-12 已記錄「PI 已決定不使用，啟用率改以首次回報計」，
      但 dashboard.py 至今仍讀這個欄位。
    consequence: >
      改 DEFAULT 為 TRUE 會把「沒有資料」偽裝成「是」，方向與 lesson_zone_a
      指出的問題相同，只是把假陰性換成假陽性；DROP COLUMN 屬收案期間的
      production schema 變更。兩者都不必動就能解決讀取端。
      已改讀取端（見 D5）：舊定義啟用率 0%（十筆全 false），
      新定義 90%（9/10）。唯一未啟用者為 FIH-003，其手術日即為今日，
      尚未到第一次回報。

  - id: 7
    severity: high
    issue: 追蹤期結束在系統的任何一端都不會出聲，HSF-001 已逾期五天仍為 active
    detail: >
      fn_report_days() 回傳 [0,1,2,3,4,5,6,7,9,11,13,20,27]——POD 30 不是回報日，
      最後一個是 POD 27。病人端在 POD 30 當天不會有推播也不會有卡片；
      每日摘要腳本的主迴圈又在 pod > FOLLOWUP_DAYS 直接 continue，
      逾期者從畫面上消失。HSF-001 手術日 2026-07-24，POD 30 為 2026-08-23，
      今日為 POD 35，study_status 仍為 active，回報 9/13。
    consequence: >
      追蹤期結束是純行政終點，沒有任何機制提示。第一位受試者已經漏過去五天。

  - id: 8
    severity: medium
    issue: study_status 只有寫入 'active' 的地方，沒有任何地方寫 completed 或 withdrawn
    detail: >
      全 codebase 對 study_status 的寫入僅 patient-onboard/index.ts:232 一處，
      值寫死為 "active"。completed_at 欄位亦從未被寫過。
      讀取端有 check-adherence（.eq("study_status","active")）、
      多個 view 的 WHERE study_status != 'withdrawn'、dashboard.py 的表格欄位。
    consequence: >
      與 app_activated 同構：宣告了 DEFAULT、有讀取端、沒有寫入端。
      直接影響本日新增的逾期清單——不手動改 study_status 的話它會單調成長。
      推播端無害：patientsDueForReminder 以 reportDays 過濾，
      最大回報日 27，逾期者不會被誤推播。

hypotheses_ruled_out:
  - hypothesis: 對照表裡有受試者的 PII 尚未寫入 pii_patients
    disproved_by: >
      對照表八列逐筆比對 pii_patients 皆有對應，且四個加密欄位的密文長度
      減 66 bytes overhead 反推的明文位元組數與對照表內容一一相符
      （姓名 9 bytes = 3 中文字；病歷號 7 或 8 bytes 與實際位數相同；
      電話 10 bytes 表示已去除破折號；出生日期 10 bytes = YYYY-MM-DD）。
      缺口全部落在對照表本身沒有的兩列。

  - hypothesis: WCC-002 的 phone_enc 為 NULL 是漏填
    disproved_by: 對照表 H 欄記載「未取得」，兩邊一致；且 phone_enc 允許 NULL。

  - hypothesis: 依 CLAUDE.md 複製「前一列」樣式即可，且只需處理有寫值的欄位
    disproved_by: >
      第 15 列（奇數，待填區有 banding）與第 13 列在全部 14 欄的 style id 都不同，
      不只 C/D/H。只複製有值欄位會讓 J/K/L/N 留下 FFF2F7FB 底色。

  - hypothesis: FIH 收案的三筆 app_activated 皆為 false，可能是該收案者的啟用流程有問題
    disproved_by: >
      症狀回報筆數顯示 FIH-001 有 6 筆、FIH-002 手術隔日即回報 1 筆，
      兩人都在使用 App。false 是死欄位的假象而非啟用問題。
      FIH-003 為 0 筆，但其手術日即為今日（POD 0）。
      FIH-001 依從性偏低另有原因（2026-08-23 已查明為缺 push subscription），與此無關。

  - hypothesis: app_activated 應該改成 DEFAULT TRUE，或直接 DROP COLUMN
    disproved_by: >
      DEFAULT TRUE 會把「沒有資料」偽裝成「是」，與 2026-08-12 lesson_zone_a
      指出的問題同構，只是假陰性換成假陽性；DROP COLUMN 屬收案期間的
      production schema 變更。實際讀取端只有 dashboard.py 兩處本機腳本，
      改讀取端即可，不需要任何 DDL。

  - hypothesis: 逾期未結案的病人可能還在被 check-adherence 誤推播提醒
    disproved_by: >
      check-adherence 雖以 study_status='active' 取病人，但 patientsDueForReminder
      再以 fn_report_days() 過濾，最大回報日為 27，POD 30 之後不可能被判定為 due。
      逾期只影響本日新增的摘要清單，不影響受試者收到的推播。

  - hypothesis: 收案日期可從手術日期減一天推得
    disproved_by: >
      本次兩筆確實成立，但這是巧合而非規則。正確來源是 patients.created_at
      轉台灣時間取日期，本次兩筆分別為 2026-08-26 與 2026-08-27，與 created_at 相符。

decisions:
  - id: D1
    decision: FIH-002、FIH-003 立即補登，不等下一次收案批次
    rationale: >
      兩者已在追蹤期內，聯絡管道的還原能力不應有空窗。
  - id: D2
    decision: enrolled_at 一律取 patients.created_at，不用 now()
    rationale: >
      沿用 2026-08-14 的做法，記到的是收案時刻而非補登時刻。
      現況十筆中 HSF-001 與 FIH-001 的 enrolled_at 與 created_at 不符
      （分別差 1h49m 與 8h26m），係 Vault 流程之前補登所致，本次未回填。
  - id: D3
    decision: 本次不動 production schema，app_activated 維持原狀
    rationale: >
      收案期間的硬性限制。且讀取端只有本機腳本，改讀取端即可，不需 DDL。
  - id: D4
    decision: 對照表新增列一律整列 A–N 複製前一資料列的 _style
    rationale: 見 findings 2，parity 使得部分複製會殘留 banding。

  - id: D5
    decision: >
      dashboard.py 的啟用率改以「該 study_id 至少有一筆 symptom_report」認定，
      app_activated 欄位保留在 schema 中不動
    rationale: >
      落實 2026-08-12 已下的決議（啟用率改以首次回報計），該決議當時未同步到讀取端。
      改動 6 行、只在 compute() 收斂一次 study_id 集合供兩處讀取端共用，
      不多打 API 也不在 render 階段重掃 reports。
      欄位留作死欄位，待收案結束後隨其他 migration 一併清除。
    trade_off: >
      「有回報」量到的是受試者實際使用行為，「有 push subscription」量到的是
      通知管道是否接通，兩者不同。此處選前者，因為 primary outcome 關心的是
      回報行為本身；管道問題另由 push subscription 檢查涵蓋。
      缺點是 POD 0 當日收案者必然計為未啟用（本次的 FIH-003 即是），
      分母含當日收案者時啟用率會被低估。

  - id: D6
    decision: >
      每日 ntfy 摘要新增兩段：POD 23–30 的「⏳ POD30 倒數」與
      「🔴 已過 POD30 未結案」，後者使 priority 至少為 high
    rationale: >
      PI 要求「POD30 前一週提醒」。做成每日倒數而非單次提醒，是因為單次提醒
      當天沒看手機就完全錯過，沒有第二次機會；每日摘要本來就每天推，
      掛在既有推播上不增加通知數量。
      逾期段是 PI 明示要加的：倒數只對還沒到期的人有用，抓不到已經漏掉的
      （HSF-001 現在就在漏）。
    trade_off: >
      同一個人會連續出現八天（POD 23–30）。逾期段在 study_status 沒有寫入端的
      現況下會單調成長，需要 PI 手動結案才會消失——這使得「清單變長」本身
      成為提示，但也可能在多位受試者同時逾期時變成噪音。
      「回報 X/Y」的分母定義為「到當日為止已過去的回報日數」，
      與 v_adherence_summary 的分母不必然相同，兩者不可直接比對。

  - id: D7
    decision: 不代為將 HSF-001 的 study_status 改為 completed
    rationale: >
      結案與否是研究判斷（D28 回診是否完成、CRF 是否收齊），不是資料清理。
      逾期清單會持續提示直到 PI 自行處理。


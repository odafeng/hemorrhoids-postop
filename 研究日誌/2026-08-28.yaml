    不影響任何分析端點；回填會再動一次 pii_patients，留待 PI 決定
  - HSF-003/004/005 的對照表 M 欄「收案狀態」仍為空（前五列皆填「追蹤中」）。
    屬對照表欄位漏填，與 PII 對齊無關，未一併補
  - app_activated 未做任何變更，dashboard.py 的讀取端亦未改
  - 未清理 transcript 與 claude-mem 中的識別資料（見 findings 5）
  - 未調查 FIH 三筆（001/002/003）app_activated 皆為 false 與 FIH-001
    缺 push subscription 是否為同一個啟用流程問題

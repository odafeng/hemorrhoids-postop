    亦未解密任何欄位回傳明文。
  checks:
    - 備份 收案對照表.bak-20260828.xlsx 已建立，git check-ignore 命中
      .gitignore:38（收案文件/收案對照表*.xlsx）
    - 第 14、15 列 B/C/D/E/F/G/H/I/M 九欄皆有值，J/K/L/N 留空（回診日期待填）
    - 第 14、15 列 A–N 全欄 style id 與第 13 列相同；字型 Noto Sans TC、置中、
      填色 00000000（banding 已移除）；E/F/I 數值格式 yyyy-mm-dd
    - 下拉清單 G6:G55 與 M6:M55 已涵蓋第 14、15 列，未調整 dv.sqref
    - INSERT 於 DO 區塊內執行，先 set_config('app.access_reason', ..., true)
      再寫入，金鑰取自 vault.decrypted_secrets 且未離開資料庫
    - 補登後全部十筆（排除 TEST-001）has_pii 皆為 true；
      新增兩筆 name 9 bytes、mrn 8 bytes、phone 10 bytes、birth_date 10 bytes，
      與來源格式相符；enrolled_at = patients.created_at 為 true
    - patients.surgery_date（2026-08-27、2026-08-28）與對照表 F 欄一致，
      consent_date 取自 patients.consent_date 轉台灣時間
    - dashboard.py 改動後 scripts/test_dashboard.py 7 項全過；
      將 compute() 還原為舊的 app_activated 邏輯後 4 項轉紅（mutation check），
      確認測試確實守得住這次改動而非恆綠
    - dashboard.py 內已無 app_activated 的功能性參照（僅剩一行註解說明原因）
    - 每日摘要新段落以四個模擬日期驗證邊界：08-26（WCC POD22，倒數段不出現）、
      08-28（WCC POD23，倒數段出現）、09-04（WCC POD30 顯示「今天到期」）、
      09-14（多人逾期時的排序與計數）。驗證時直接呼叫 build_summary()，
      不經過 push()，避免測試推播洗手機
    - 以 /usr/bin/python3（3.9.6，launchd plist 指定的直譯器）確認可執行，
      非開發機上的 homebrew 3.14
    - 端到端實跑一次含推播（SUMMARY_DATE=2026-08-28），
      keychain 取 token 與 ntfy 送達皆正常，exit 0


<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>App QR Code</title>
<style>
  @page { size: A4 portrait; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans TC", -apple-system, "Helvetica Neue", Arial, sans-serif;
    width: 210mm; height: 297mm;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card {
    text-align: center;
    max-width: 160mm;
  }

  /* ── Logo ── */
  .logo {
    width: 72px; height: 72px;
    border-radius: 50%;
    object-fit: contain;
    margin-bottom: 12px;
    box-shadow: 0 2px 12px rgba(15,76,117,0.12);
  }

  /* ── Text ── */
  .hosp {
    font-size: 13px;
    color: #6b7585;
    letter-spacing: 0.2em;
    margin-bottom: 2px;
  }
  .title {
    font-size: 30px;
    font-weight: 800;
    color: #0f4c75;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .sub {
    font-size: 13px;
    color: #4a5568;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .rule {
    width: 60%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #0f4c75 20%, #0f4c75 80%, transparent);
    margin: 0 auto 24px;
  }

  /* ── QR ── */
  .qr-wrap {
    display: inline-block;
    padding: 16px;
    background: #fff;
    border: 2px solid #e0e5ec;
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(15,76,117,0.08);
    margin-bottom: 18px;
  }
  .qr-wrap img {
    width: 260px;
    height: 260px;
    display: block;
  }

  /* ── URL ── */
  .url-box {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #f2f7fb;
    border: 1.5px solid #d0dce8;
    border-radius: 10px;
    padding: 10px 20px;
    margin-bottom: 24px;
  }
  .url-icon {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #0f4c75;
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 11px;
    flex-shrink: 0;
  }
  .url-text {
    font-family: "Menlo", "SF Mono", monospace;
    font-size: 13px;
    color: #0f4c75;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  /* ── Instructions ── */
  .steps {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 28px;
  }
  .step {
    text-align: center;
    max-width: 120px;
  }
  .step-num {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0f4c75, #3282b8);
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    display: grid;
    place-items: center;
    margin: 0 auto 6px;
  }
  .step-txt {
    font-size: 11.5px;
    color: #4a5568;
    line-height: 1.55;
  }
  .step-txt b { color: #0f4c75; }

  /* ── Footer ── */
  .footer {
    padding-top: 16px;
    border-top: 1px solid #e8ecf1;
    width: 80%;
    text-align: center;
  }
  .footer-line {
    font-size: 9.5px;
    color: #a0a8b4;
    letter-spacing: 0.04em;
    line-height: 1.8;
  }
  .footer-line b { color: #6b7585; }
</style>
</head>

name: CI — Lint, Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run

      - name: Build production bundle
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: prototype

    # E2E runs against an ephemeral LOCAL Supabase (spun up by the CLI inside the
    # runner) — never prod. Fixtures use clearly-fake TEST- study_ids and
    # local-only accounts, so nothing here can touch real IRB study data.
    env:
      VITE_E2E: "1" # reveal the demo-mode button in the E2E build (prod unaffected)
      E2E_EMAIL: e2e-patient@example.com
      E2E_PASSWORD: E2ePass-Aa1!
      E2E_RESEARCHER_EMAIL: e2e-researcher@example.com
      E2E_RESEARCHER_PASSWORD: E2eRes-Aa1!
      E2E_PI_EMAIL: e2e-pi@example.com
      E2E_PI_PASSWORD: E2ePi-Aa1!
      E2E_INVITE_CODE: E2E-TEST-INVITE-001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase + export connection env
        run: |
          supabase start -x studio,realtime,storage-api,imgproxy,inbucket,vector
          supabase status -o env > /tmp/sbenv
          set -a; . /tmp/sbenv; set +a
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Build for preview (against local Supabase)
        run: npm run build

      - name: Seed E2E test users (idempotent)
        run: npm run seed:e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Upload E2E failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: prototype/test-results/
          retention-days: 7

name: Uptime Monitor

# Actively probes the ai-chat dependency chain (via the `health` Edge Function)
# and reports pass/fail to Healthchecks.io, which handles alerting + escalation
# to the PI's phone and its own dead man's switch (fires if this workflow ever
# stops running). See docs/superpowers/specs/2026-07-26-ai-chat-uptime-monitoring-design.md
#
# Required secrets:
#   SUPABASE_URL  — https://<project-ref>.supabase.co   (already configured)
#   HEALTH_TOKEN  — shared secret matching the function's HEALTH_TOKEN env var
#   HC_PING_URL   — https://hc-ping.com/<uuid>           (Healthchecks.io check)

on:
  schedule:
    - cron: '*/5 * * * *'   # ~every 5 min (GitHub may delay scheduled runs)
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ai-chat health endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: |
          set -uo pipefail
          url="${SUPABASE_URL}/functions/v1/health?token=${HEALTH_TOKEN}"

          code=""
          body=""
          # Up to 2 attempts to tolerate an Edge Function cold start.
          for attempt in 1 2; do
            resp=$(curl -sS -m 20 -w $'\n%{http_code}' "$url" || true)
            code=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            [ "$code" = "200" ] && break
            [ "$attempt" = "1" ] && sleep 10
          done

          echo "HTTP $code"
          printf '%s\n' "$body" | jq . 2>/dev/null || printf '%s\n' "$body"

          if [ "$code" = "200" ]; then
            curl -fsS -m 10 "$HC_PING_URL" >/dev/null || true
          else
            # Report the failure body to Healthchecks.io for immediate alerting.
            printf '%s' "$body" | curl -fsS -m 10 --data-binary @- "$HC_PING_URL/fail" >/dev/null || true
            echo "::error::ai-chat health degraded (HTTP $code)"
            exit 1
          fi
